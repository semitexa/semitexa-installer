name: Build & Publish Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      # A release cut tags every package's master with the UTC release
      # version (YYYY.MM.DD.HHMM, with -beta for a beta). The image built from
      # that tag is the one that release's install.sh writes projects with:
      # it carries the version, and a stable release moves `latest` too.
      - '20*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default is true, which leaves the GITHUB_TOKEN in .git/config for
          # every later step to read. This job builds an image and pushes it to
          # Docker Hub; it never talks to git again, so the credential is pure
          # exposure — a build step, or anything the build pulls in, can read it.
          persist-credentials: false

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: semitexa/installer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/20') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/20') && !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
