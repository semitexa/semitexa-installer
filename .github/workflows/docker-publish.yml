name: Build & Publish Docker Image

# Release tags only (dec-one-source-for-bin-semitexa, step 3c of one source
# for bin/semitexa). A push to master also rebuilt `latest`, so the image a
# new project got moved ahead of every release, and could finish after a
# release's own build and replace it. The old v* tags have not been used since
# the CalVer releases. A pull request is booted by stack-smoke.yml instead.
on:
  push:
    tags:
      # A release cut tags every package's master with the UTC release
      # version (YYYY.MM.DD.HHMM, with -beta for a beta). The image built from
      # that tag is the one that release's install.sh writes projects with:
      # it carries the version, and a stable release moves `latest` too.
      - '20*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default is true, which leaves the GITHUB_TOKEN in .git/config for
          # every later step to read. This job builds an image and pushes it to
          # Docker Hub; it never talks to git again, so the credential is pure
          # exposure — a build step, or anything the build pulls in, can read it.
          persist-credentials: false

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Is this the newest stable release tag?
        id: release
        if: startsWith(github.ref, 'refs/tags/20')
        # `latest` follows the newest stable release only. Release runs do not
        # wait for each other, so an older one finishing last must not move it
        # back (review, installer#120). A concurrency group would not do: it
        # keeps one pending run, so a third push would cancel a release's
        # image. CalVer tags sort by name (YYYY.MM.DD.HHMM); a beta (-beta)
        # never counts.
        run: |
          # The lookup on its own: in a pipe its failure was hidden (no pipefail),
          # and an empty answer published the release without moving `latest`
          # (review, installer#120). An empty stable list stays valid: a beta.
          if ! tags=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" '20*'); then
            echo "::error::could not list the release tags of ${GITHUB_REPOSITORY}"
            exit 1
          fi
          newest=$(printf '%s\n' "$tags" | sed 's#.*refs/tags/##' | grep -v -e '-' | sort | tail -n 1)
          echo "newest stable release tag: ${newest:-none}, this one: ${GITHUB_REF_NAME}"
          if [ -n "$newest" ] && [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "moves_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "moves_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: semitexa/installer
          tags: |
            # The release version as a raw tag: type=ref,event=tag would also set
            # `latest` on every tag under the default latest=auto flavor, beta too
            # (review, installer#120). `latest` comes only from the next line.
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/20') }}
            type=raw,value=latest,enable=${{ steps.release.outputs.moves_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
